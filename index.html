<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech SMS Earning Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes popupIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-popup {
            animation: popupIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-green-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-emerald-100 p-6 sm:p-8">
        
        <!-- Header / Logo Area -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-800 tracking-tight">Fintech SMS Earning</h1>
            <p class="text-xs text-gray-500 mt-1">Secure & Fast Simulated Earning Platform</p>
        </div>

        <!-- Toggle Switch -->
        <div class="flex bg-emerald-50 p-1 rounded-xl mb-6 relative">
            <div id="toggle-bg" class="absolute w-1/2 h-[calc(100%-8px)] top-1 bg-emerald-600 rounded-lg shadow-sm transition-all duration-300"></div>
            <button onclick="switchTab('login')" id="btn-login" class="w-1/2 py-2.5 text-sm font-semibold z-10 text-white transition-colors duration-200">Login</button>
            <button onclick="switchTab('register')" id="btn-register" class="w-1/2 py-2.5 text-sm font-semibold z-10 text-emerald-700 transition-colors duration-200">Register</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mobile Number</label>
                <input type="tel" id="login-mobile" required placeholder="Enter mobile number" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" id="login-password" required placeholder="Enter password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition-all active:scale-[0.98]">
                Login
            </button>
        </form>

        <!-- Registration Form -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="reg-name" required placeholder="Enter your full name" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mobile Number</label>
                <input type="tel" id="reg-mobile" required placeholder="Enter mobile number" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Create Password</label>
                <input type="password" id="reg-password" required placeholder="Create a strong password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center text-xs text-emerald-800 font-medium">
                🎁 Get <span class="font-bold">₹100 Sign-up Bonus</span> instantly in your wallet!
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition-all active:scale-[0.98]">
                Register Now
            </button>
        </form>
    </div>

    <!-- Animated Popup Modal -->
    <div id="popup-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div id="popup-box" class="bg-white w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl animate-popup transform transition-all">
            <div id="popup-icon-container" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl">
                <!-- Dynamic Icon -->
            </div>
            <h3 id="popup-title" class="text-lg font-bold text-gray-800 mb-1"></h3>
            <p id="popup-message" class="text-sm text-gray-600 mb-6"></p>
            <button onclick="closePopup()" class="w-full py-2.5 bg-gray-900 hover:bg-black text-white font-semibold rounded-xl transition-all">
                OK
            </button>
        </div>
    </div>

    <script>
        // Toggle Switch Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const btnLogin = document.getElementById('btn-login');
            const btnReg = document.getElementById('btn-register');
            const toggleBg = document.getElementById('toggle-bg');

            if (tab === 'login') {
                toggleBg.style.transform = 'translateX(0%)';
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                btnLogin.classList.add('text-white');
                btnLogin.classList.remove('text-emerald-700');
                btnReg.classList.add('text-emerald-700');
                btnReg.classList.remove('text-white');
            } else {
                toggleBg.style.transform = 'translateX(100%)';
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                btnReg.classList.add('text-white');
                btnReg.classList.remove('text-emerald-700');
                btnLogin.classList.add('text-emerald-700');
                btnLogin.classList.remove('text-white');
            }
        }

        // Popup Notification System
        function showPopup(type, title, message) {
            const modal = document.getElementById('popup-modal');
            const iconContainer = document.getElementById('popup-icon-container');
            const titleEl = document.getElementById('popup-title');
            const msgEl = document.getElementById('popup-message');

            titleEl.innerText = title;
            msgEl.innerText = message;

            if (type === 'success') {
                iconContainer.className = "w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl bg-emerald-100 text-emerald-600";
                iconContainer.innerHTML = "✓";
            } else {
                iconContainer.className = "w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl bg-red-100 text-red-600";
                iconContainer.innerHTML = "✕";
            }

            modal.classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popup-modal').classList.add('hidden');
        }

        // Handle Registration
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const mobile = document.getElementById('reg-mobile').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, mobile, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showPopup('success', 'Registration Successful!', 'Your account has been created successfully. ₹100 bonus added! Please login now.');
                    switchTab('login');
                } else {
                    showPopup('error', 'Registration Failed', data.error || 'Something went wrong. Please try again.');
                }
            } catch (err) {
                showPopup('error', 'Error', 'Network error or server unavailable.');
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const mobile = document.getElementById('login-mobile').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showPopup('success', 'Login Successful!', 'Welcome back! Redirecting to your dashboard...');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html'; // ya jo bhi aapka dashboard route ho
                    }, 1500);
                } else {
                    showPopup('error', 'Login Failed', data.error || 'Wrong password or mobile number. Please try again.');
                }
            } catch (err) {
                showPopup('error', 'Error', 'Network error or server unavailable.');
            }
        }
    </script>
</body>
</html>
