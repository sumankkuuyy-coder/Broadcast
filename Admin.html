<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Fintech</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 min-h-screen text-gray-100 flex flex-col items-center justify-center p-4">

    <!-- ADMIN LOGIN BOX (Shown if not logged in) -->
    <div id="admin-login-box" class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
        <h2 class="text-xl font-bold text-center text-purple-400 mb-4">🔐 Admin Portal Login</h2>
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Admin Mobile</label>
                <input type="tel" id="admin-mobile" required placeholder="Enter mobile number" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Password</label>
                <input type="password" id="admin-password" required placeholder="Enter password" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl transition-all shadow-lg shadow-purple-600/30 text-sm">
                Access Admin Panel
            </button>
        </form>
    </div>

    <!-- ADMIN DASHBOARD (Hidden until logged in) -->
    <div id="admin-dashboard" class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl p-6 shadow-2xl hidden flex flex-col min-h-[600px]">
        <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
            <div>
                <h2 class="text-lg font-bold text-purple-400">🔐 Admin Control Panel</h2>
                <p class="text-xs text-gray-400">Manage UTR Add Funds & Payout Withdrawals</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadAdminData()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">Refresh</button>
                <button onclick="adminLogout()" class="bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">Logout</button>
            </div>
        </div>

        <!-- Requests List Container -->
        <div class="flex-1 overflow-y-auto space-y-3" id="admin-requests-container">
            <p class="text-xs text-gray-400 text-center py-10">Loading pending requests...</p>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const mobile = document.getElementById('admin-mobile').value;
            const password = document.getElementById('admin-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, password })
                });
                const data = await res.json();
                
                if (res.ok && data.user.role === 'admin') {
                    document.getElementById('admin-login-box').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    loadAdminData();
                } else {
                    alert('Access Denied: Invalid admin credentials.');
                }
            } catch (err) {
                alert('Network error during login.');
            }
        }

        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/requests');
                const data = await res.json();
                if (res.ok) {
                    const container = document.getElementById('admin-requests-container');
                    let html = "";

                    // Render Add Fund Requests
                    data.funds.forEach(f => {
                        html += `
                            <div class="bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-xs space-y-2">
                                <div class="flex justify-between font-bold text-gray-200">
                                    <span>👤 User: ${f.name} (${f.mobile})</span>
                                    <span class="text-blue-400">Add Fund: ₹${f.amount}</span>
                                </div>
                                <p class="text-[11px] text-gray-400 font-mono">UTR No: ${f.utr_number} | Status: <b class="${f.status === 'Approved' ? 'text-emerald-400' : f.status === 'Rejected' ? 'text-red-400' : 'text-amber-400'}">${f.status}</b></p>
                                ${f.status === 'Pending' ? `
                                    <div class="flex gap-2 pt-1">
                                        <button onclick="adminAction('fund', ${f.id}, 'Approved')" class="w-1/2 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold">Approve</button>
                                        <button onclick="adminAction('fund', ${f.id}, 'Rejected')" class="w-1/2 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold">Reject</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });

                    // Render Withdrawal Requests
                    data.withdrawals.forEach(w => {
                        html += `
                            <div class="bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-xs space-y-2">
                                <div class="flex justify-between font-bold text-gray-200">
                                    <span>👤 User: ${w.name} (${w.mobile})</span>
                                    <span class="text-indigo-400">Withdrawal: ₹${w.amount}</span>
                                </div>
                                <p class="text-[11px] text-gray-400 font-mono">Bank Details: ${w.payment_info} | Status: <b class="${w.status === 'Approved' ? 'text-emerald-400' : w.status === 'Rejected' ? 'text-red-400' : 'text-amber-400'}">${w.status}</b></p>
                                ${w.status === 'Pending' ? `
                                    <div class="flex gap-2 pt-1">
                                        <button onclick="adminAction('withdrawal', ${w.id}, 'Approved')" class="w-1/2 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold">Approve</button>
                                        <button onclick="adminAction('withdrawal', ${w.id}, 'Rejected')" class="w-1/2 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold">Reject</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });

                    container.innerHTML = html || `<p class="text-xs text-gray-400 text-center py-10">No pending requests found.</p>`;
                }
            } catch (err) {
                console.error("Failed to load admin data");
            }
        }

        async function adminAction(type, id, action) {
            try {
                const res = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, id, action })
                });
                if (res.ok) {
                    loadAdminData();
                }
            } catch (err) {
                alert('Action failed.');
            }
        }

        function adminLogout() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login-box').classList.remove('hidden');
            document.getElementById('admin-mobile').value = "";
            document.getElementById('admin-password').value = "";
        }
    </script>
</body>
</html>
